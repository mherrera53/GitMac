        - "$(PROJECT_DIR)/Frameworks/GhosttyKit.xcframework/macos-arm64_x86_64/Headers"
        FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(PROJECT_DIR)/Frameworks"
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_FILE: Tests/GitMacTests/Info.plist
        SWIFT_VERSION: '5.0'
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitMac.app/Contents/MacOS/GitMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GitMac:
