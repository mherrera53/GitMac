# Build and test GitMac
name: Build

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, upstream verified
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify CI failure handling
        run: |
          node scripts/test-xcodebuild-gate.mjs

      - name: Setup GhosttyKit Framework
        run: |
          chmod +x scripts/setup-ghostty.sh
          ./scripts/setup-ghostty.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          bash scripts/verify-xcodebuild.sh build /tmp/build.log -project GitMac.xcodeproj \
            -scheme GitMac \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # The project currently has no GitMacTests target in its scheme. Run the
      # importable production model tests and explicit core regressions instead
      # of skipping its only test target and reporting an empty run as success.
      - name: Test production models and core regressions
        run: |
          set -euo pipefail
          node scripts/test-core-regressions.mjs 2>&1 | tee /tmp/test.log
          node scripts/test-git-integration.mjs 2>&1 | tee /tmp/git-process-test.log
          node scripts/test-production-suites.mjs 2>&1 | tee /tmp/production-suite-test.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, upstream verified
        with:
          name: build-test-evidence
          path: |
            /tmp/build.log
            /tmp/test.log
            /tmp/git-process-test.log
            /tmp/production-suite-test.log
